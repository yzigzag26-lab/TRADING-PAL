name: Backend and Documentation CI

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "docs/**"
      - "zensical.toml"
      - "requirements-docs.txt"
      - ".github/workflows/backend-ci.yml"
      - "render.yaml"
  push:
    branches:
      - main
      - chore/backend-supporting-foundation
      - feat/backend-stage-1-health-foundation
    paths:
      - "apps/api/**"
      - "docs/**"
      - "zensical.toml"
      - "requirements-docs.txt"
      - ".github/workflows/backend-ci.yml"
      - "render.yaml"

permissions:
  contents: read

jobs:
  backend-foundation:
    name: Python 3.12 quality checks and documentation build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version-file: "apps/api/.python-version"
          cache: pip
          cache-dependency-path: |
            apps/api/pyproject.toml
            requirements-docs.txt
      - name: Install backend development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Install documentation tools
        run: python -m pip install -r ../../requirements-docs.txt
      - name: Ruff format check
        run: ruff format --check --diff app tests
      - name: Ruff lint
        run: ruff check app tests
      - name: Mypy
        run: mypy app tests
      - name: Pytest
        run: pytest
      - name: Strict Zensical build
        working-directory: .
        run: zensical build --strict
