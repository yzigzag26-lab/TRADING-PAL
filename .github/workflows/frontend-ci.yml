name: Frontend CI

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - main
      - feat/version-1-frontend
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

jobs:
  frontend:
    name: Install, integration, lint, typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Proxy integration test
        run: npm run test:proxy-integration

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
