name: Temporary Gate 3 live Binance payload smoke

on:
  push:
    branches:
      - gate-3-live-payload-smoke

permissions:
  contents: read

jobs:
  live-binance-payload-smoke:
    name: Live Binance Spot REST and WebSocket payload parsing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Baymax API package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e apps/api
          python -m pip install ruff==0.11.13
      - name: Check temporary script formatting
        run: ruff format --check apps/api/scripts/gate_3_live_payload_smoke.py
      - name: Lint temporary script
        run: ruff check apps/api/scripts/gate_3_live_payload_smoke.py
      - name: Execute live public Binance smoke test
        run: python apps/api/scripts/gate_3_live_payload_smoke.py
