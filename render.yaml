services:
  - type: web
    name: baymax-api
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: python -m pip install --upgrade pip && python -m pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ALLOWED_ORIGINS
        value: https://baymax-nu.vercel.app
